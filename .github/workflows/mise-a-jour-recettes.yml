name: Mise a jour automatique des recettes

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write

concurrency:
  group: mise-a-jour-recettes
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechercher et ajouter les nouvelles recettes
        run: python scripts/mettre_a_jour_recettes.py
      - name: Enregistrer le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-mise-a-jour-recettes
          path: rapport_mise_a_jour.json
          if-no-files-found: ignore
      - name: Publier le catalogue modifie
        run: |
          if git diff --quiet -- recettes.json; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recettes.json
          git commit -m 'Actualiser le catalogue des recettes'
          git push
